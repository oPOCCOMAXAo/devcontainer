name: example

services:
  devcontainer:
    build: .
    image: poccomaxa/devcontainer:latest
    container_name: devcontainer-example
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4096:4096"
    volumes:
      - workspace:/workspace
      - opencode-config:/home/ubuntu/.config/opencode

volumes:
  workspace:
  opencode-config:
